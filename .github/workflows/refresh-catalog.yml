name: Refresh public help catalog
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_catalog.py'
      - '.github/workflows/refresh-catalog.yml'
permissions:
  contents: write
concurrency:
  group: refresh-help-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collector regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Collect public metadata
        run: python scripts/refresh_catalog.py
      - name: Save observations and review queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data/catalog.json data/review-queue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public source observations and review queue'
          git push origin HEAD:main
